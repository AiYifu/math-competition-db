version: '3.8'

services:
  ocr-service:
    build: ./services/ocr-service
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data

  retrieval-service:
    build: ./services/retrieval-service
    ports:
      - "8002:8000"
    volumes:
      - ./data:/app/data
    environment:
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}